version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jetreset-postgres
    environment:
      POSTGRES_USER: jetreset_user
      POSTGRES_PASSWORD: jetreset_password
      POSTGRES_DB: jetreset_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jetreset_user -d jetreset_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
